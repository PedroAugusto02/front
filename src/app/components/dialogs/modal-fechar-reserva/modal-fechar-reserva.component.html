<h1 mat-dialog-title>Fechar Reserva</h1>
<h1 mat-dialog-title>Vaga {{ vaga.numeroDaVaga }}</h1>
<mat-dialog-content class="mat-typography">
  <div>
    <h2>Entrada: {{ formatarData(reserva.dataHoraReserva) }}</h2>
    <h2>Saída: {{ dataHoraTerminoFormatada }}</h2>
    <h2>Valor Calculado: 
      <span class="valor-destaque">R$ {{ valorCalculado | number: '1.2-2' }}</span>
    </h2> 
  </div>
  <div class="d-flex">
    <app-button class="disponível float-left" [label]="'Cancelar'" [color]="'basic'" (buttonClick)="cancelar()"/>
    <app-button class="disponível float-right" [label]="'Fechar Reserva'" [color]="'primary'" (buttonClick)="fecharReserva()"/>
  </div>
</mat-dialog-content>
