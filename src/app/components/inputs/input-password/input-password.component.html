<mat-form-field>
    <mat-label>{{label}}</mat-label>
    <input matInput [type]="hide() ? 'password' : 'text'" [placeholder]="placeholder" [formControl]="campoFormControl"
        (input)="onInputChange($event)" />
    <mat-error *ngIf="campoFormControl.hasError('required')">
        {{ label }} é <strong>obrigatório</strong>
    </mat-error>
    <button mat-icon-button matSuffix (click)="clickEvent($event)" [attr.aria-label]="'Hide password'"
        [attr.aria-pressed]="hide()">
        <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
    </button>
</mat-form-field>
