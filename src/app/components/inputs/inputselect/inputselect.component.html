<mat-form-field class="example-full-width">
  <mat-label>{{ label }}</mat-label>
  <mat-select [formControl]="campoFormControl" (selectionChange)="onSelectionChange($event)">
    <mat-option *ngFor="let item of lista" [value]="item[atributoValor]">
      {{ item[atributoExibido] }}
    </mat-option>
  </mat-select>
</mat-form-field>
