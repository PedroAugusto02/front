<mat-form-field class="example-full-width">
  <mat-label>{{ label }}</mat-label>
  <input matInput
         [formControl]="campoFormControl"
         [placeholder]="placeholder">
  <mat-error *ngIf="campoFormControl.hasError('required')">
    {{ label }} é <strong>obrigatório</strong>
  </mat-error>
</mat-form-field>
