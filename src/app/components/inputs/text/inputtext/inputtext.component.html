<mat-form-field class="example-full-width {{class}}">
  <mat-label>{{ label }}</mat-label>
  <input matInput maxlength={{maximoCaracteres}} [formControl]="campoFormControl" [placeholder]="placeholder">
  <mat-error *ngIf="campoFormControl.hasError('required')">
    {{ label }} é <strong>obrigatório</strong>
  </mat-error>
</mat-form-field>
