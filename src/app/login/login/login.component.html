<mat-toolbar color="topo-login">
  <loader-circular></loader-circular>
  <h1 class="titulo">Login</h1>
</mat-toolbar>
<div class="login-container">
  <div class="shadow p-4 menu-login" (keyup.enter)="loginMethod()">
    <inputtext class="input-custom-width" [label]="'Login'" [placeholder]="'ex: Pedro'" [value]="login" [validacao]="true"
      (valueChange)="login = $event"></inputtext>
    <input-password class="estilomeu" [label]="'Senha'" [placeholder]="'ex: *****'" [value]="password" [validacao]="true"
      (valueChange)="password = $event"></input-password>
    <div class="d-flex botoes">
      <div><app-button [label]="'Login'" [color]="'primary'" class="full-width-button" (buttonClick)="loginMethod()"></app-button></div>
      <div><app-button [label]="'Cadastro'" [color]="'incluir-reserva'" class="full-width-button" (buttonClick)="cadastrar()"></app-button></div>
    </div>
  </div>
</div>
