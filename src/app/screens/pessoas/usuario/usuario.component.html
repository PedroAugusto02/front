<div class="shadow p-4">
  <mat-tab-group dynamicHeight>
    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="example-tab-icon">person</mat-icon>
        Dados Pessoais
      </ng-template>
      <div class="mt-3 row">
        <div class="col-md-2">
          <inputtext [label]="'Nome'" [value]="usuarioLogado.nome" />
        </div>
        <div class="col-md-2">
          <inputtext [label]="'Email'" [value]="usuarioLogado.email" />
        </div>
        <div class="col-md-2">
          <inputtext [label]="'Idade'" [value]="usuarioLogado.age" />
        </div>
      </div>
    </mat-tab>

    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="example-tab-icon">directions_car</mat-icon>
        Carro
      </ng-template>
      <div class="example-large-box mat-elevation-z4">
        Content 2
      </div>
    </mat-tab>

    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="example-tab-icon">local_parking</mat-icon>
        Estacionamento
      </ng-template>

      Content 3
    </mat-tab>
  </mat-tab-group>
</div>
